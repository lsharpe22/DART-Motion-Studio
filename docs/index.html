
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DART Motion Viewer</title>
<style>
body {
    margin: 0;
    background: #0b1424;
    color: #e8eef8;
    font-family: Arial, sans-serif;
}
header {
    padding: 18px 24px;
    background: #111f34;
    border-bottom: 1px solid #293b55;
}
h2 { margin: 0; color: #f1a35b; }
p { color: #aebbd0; }
#viewer { height: 65vh; }
.controls {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px;
    flex-wrap: wrap;
}
button, select {
    background: #d68143;
    border: 0;
    color: #101826;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}
input[type=range] { width: 260px; }
</style>
</head>
<body>
<header>
    <h2>DART Motion Studio</h2>
    <p id="prompt">Loading motion...</p>
</header>

<div class="controls">
    <input id="promptInput"
           type="text"
           value="walk forward"
           placeholder="Describe a motion"
           style="padding:10px; min-width:280px;">
    <select id="repetitions">
        <option value="5">Short</option>
        <option value="10">Medium</option>
        <option value="20">Long</option>
    </select>

<div id="apiConnection" style="margin:12px 0; display:grid; gap:10px;">
    <label style="display:block;">
        Backend URL
        <input
            id="apiBase"
            type="url"
            placeholder="https://your-tunnel.trycloudflare.com"
            style="width:100%; box-sizing:border-box;"
            autocomplete="off"
        />
    </label>

    <label style="display:block;">
        API Key
        <input
            id="apiKey"
            type="password"
            placeholder="Enter your DART API key"
            style="width:100%; box-sizing:border-box;"
            autocomplete="off"
        />
    </label>
</div>
<button id="generate">Generate Motion</button>
<button id="continueMotion" type="button" disabled>
    Continue Motion
</button>

    <span id="status">Ready</span>
</div>
<div id="viewer"></div>

<div class="controls">
    <button id="play">Pause</button>
    <label>Frame <input type="range" id="frame" min="0" value="0"></label>
    <span id="counter"></span>
    <label>Up axis
        <select id="axis">
            <option value="z">Z up</option>
            <option value="y">Y up</option>
        </select>
    </label>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const container = document.getElementById("viewer");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1424);

const camera = new THREE.PerspectiveCamera(
    50, container.clientWidth / container.clientHeight, 0.01, 100
);
camera.position.set(3, 2.5, 3);

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 1.5));

const grid = new THREE.GridHelper(4, 20, 0x536780, 0x25344a);
scene.add(grid);

// Skeleton connections for a common 22-joint SMPL-style ordering.
// We will verify this mapping against DART's actual joint definition.
const bones = [
    [0,1],[0,2],[0,3],
    [1,4],[2,5],[3,6],
    [4,7],[5,8],[6,9],
    [7,10],[8,11],[9,12],
    [12,13],[12,14],[12,15],
    [13,16],[14,17],
    [16,18],[17,19],
    [18,20],[19,21]
];

const jointsGroup = new THREE.Group();
scene.add(jointsGroup);

const spheres = [];
for (let i = 0; i < 22; i++) {
    const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.035, 10, 10),
        new THREE.MeshStandardMaterial({color: 0xf2a365})
    );
    jointsGroup.add(sphere);
    spheres.push(sphere);
}

const lines = bones.map(() => {
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(6);
    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(positions, 3)
    );
    const line = new THREE.Line(
        geometry,
        new THREE.LineBasicMaterial({color: 0x83b7d7})
    );
    jointsGroup.add(line);
    return line;
});

let motion = null;
let frame = 0;
let playing = true;
let lastFrameTime = 0;

const slider = document.getElementById("frame");
const counter = document.getElementById("counter");
const axis = document.getElementById("axis");

function convert(point) {
    const [x,y,z] = point;
    // Three.js uses Y as its vertical axis.
    if (axis.value === "z") return new THREE.Vector3(x,z,y);
    return new THREE.Vector3(x,y,z);
}

function drawFrame(index) {
    if (!motion) return;
    const joints = motion.joints[index];

    joints.forEach((point, i) => {
        spheres[i].position.copy(convert(point));
    });

    bones.forEach(([a,b], i) => {
        const positions = lines[i].geometry.attributes.position;
        const p1 = convert(joints[a]);
        const p2 = convert(joints[b]);
        positions.setXYZ(0,p1.x,p1.y,p1.z);
        positions.setXYZ(1,p2.x,p2.y,p2.z);
        positions.needsUpdate = true;
    });

    slider.value = index;
    counter.textContent = `${index + 1} / ${motion.frames}`;
}

document.getElementById("play").onclick = () => {
    playing = !playing;
    document.getElementById("play").textContent =
        playing ? "Pause" : "Play";
};

slider.oninput = () => {
    frame = Number(slider.value);
    drawFrame(frame);
};

axis.onchange = () => drawFrame(frame);

async function loadMotion() {
    const response = await fetch("./motion.json");
    if (!response.ok) throw new Error("Could not load motion.json");

    motion = await response.json();
    document.getElementById("prompt").textContent =
        `Prompt: ${motion.prompt}`;
    slider.max = motion.frames - 1;

    // Find the lowest joint across all frames.
    // Convert Z-up motion into Three.js Y-up coordinates.
    let minHeight = Infinity;

    for (const frame of motion.joints) {
        for (const joint of frame) {
            const position = convert(joint);
            minHeight = Math.min(minHeight, position.y);
        }
    }

    // Place the grid just below the lowest joint.
    grid.position.y = minHeight - 0.02;

    drawFrame(0);
}


const generateButton = document.getElementById("generate");
const statusLabel = document.getElementById("status");

const continueButton = document.getElementById("continueMotion");
let motionSessionId = null;
let motionSessionBase = null;


generateButton.onclick = async () => {
    const prompt = document.getElementById("promptInput").value.trim();
    const repetitions = Number(
        document.getElementById("repetitions").value
    );

    if (!prompt) {
        statusLabel.textContent = "Please enter a prompt.";
        return;
    }


    const apiBase = document.getElementById("apiBase")
        .value.trim().replace(/\/+$/, "");

    const apiKey = document.getElementById("apiKey")
        .value.trim();

    if (!apiBase.startsWith("https://")) {
        statusLabel.textContent = "Enter your HTTPS backend URL.";
        return;
    }

    if (!apiKey) {
        statusLabel.textContent = "Enter your API key.";
        return;
    }

    continueButton.disabled = true;
    generateButton.disabled = true;
    statusLabel.textContent = "Generating motion...";

    try {
        const response = await fetch(`${apiBase}/generate`, {
            method: "POST",
            headers: {"Content-Type": "application/json", "X-API-Key": apiKey},
            body: JSON.stringify({prompt, repetitions})
        });

        if (!response.ok) {
            const error = await response.text();
            throw new Error(error);
        }

        const result = await response.json();

        motion = result;
        motionSessionId = result.session_id || null;
        motionSessionBase = apiBase;
        frame = 0;
        playing = true;
        lastFrameTime = performance.now();

        slider.max = motion.frames - 1;
        document.getElementById("prompt").textContent =
            `Prompt: ${motion.prompt}`;

        // Reposition the floor for the new animation.
        let minHeight = Infinity;
        for (const motionFrame of motion.joints) {
            for (const joint of motionFrame) {
                minHeight = Math.min(minHeight, convert(joint).y);
            }
        }
        grid.position.y = minHeight - 0.02;

        drawFrame(0);

        document.getElementById("play").textContent = "Pause";
        statusLabel.textContent =
            `Done! ${motion.frames} frames generated.`;

    } catch (error) {
        console.error(error);
        statusLabel.textContent = "Generation failed: " + error.message;
    } finally {
        generateButton.disabled = false;
        continueButton.disabled = !motionSessionId;
    }
};


continueButton.onclick = async () => {
    const prompt = document.getElementById("promptInput").value.trim();
    const repetitions = Number(
        document.getElementById("repetitions").value
    );

    const apiBase = document.getElementById("apiBase")
        .value.trim().replace(/\/+$/, "");

    const apiKey = document.getElementById("apiKey").value.trim();

    if (!motionSessionId || !motion || !motion.joints) {
        statusLabel.textContent = "Generate a new motion first.";
        return;
    }

    if (!prompt) {
        statusLabel.textContent = "Enter the next action.";
        return;
    }

    if (apiBase !== motionSessionBase) {
        statusLabel.textContent =
            "Backend changed. Generate a new motion to start a session.";
        return;
    }

    if (!apiKey) {
        statusLabel.textContent = "Enter your DART API key.";
        return;
    }

    // Hold the character at its ending pose during generation.
    const previousFrame = frame;
    const previousPlaying = playing;
    const previousFrameCount = motion.joints.length;

    playing = false;
    frame = previousFrameCount - 1;
    drawFrame(frame);

    generateButton.disabled = true;
    continueButton.disabled = true;
    statusLabel.textContent = "Continuing motion from the last pose...";

    try {
        const response = await fetch(`${apiBase}/continue`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-API-Key": apiKey
            },
            body: JSON.stringify({
                prompt,
                repetitions,
                session_id: motionSessionId
            })
        });

        if (!response.ok) {
            const error = await response.json().catch(() => ({}));

            if (response.status === 404) {
                motionSessionId = null;
            }

            throw new Error(
                error.detail || `HTTP ${response.status}`
            );
        }

        const result = await response.json();

        if (
            !result.continued ||
            result.session_id !== motionSessionId ||
            !Array.isArray(result.joints) ||
            result.joints.length === 0
        ) {
            throw new Error("Invalid continuation response.");
        }

        // Append ONLY new frames; backend removes history duplicates.
        motion.joints.push(...result.joints);
        motion.frames = motion.joints.length;
        motion.prompt += " → " + prompt;

        slider.max = motion.frames - 1;

        document.getElementById("prompt").textContent =
            `Sequence: ${motion.prompt}`;

        // Keep the floor beneath the full animation.
        let minHeight = Infinity;

        for (const motionFrame of motion.joints) {
            for (const joint of motionFrame) {
                minHeight = Math.min(
                    minHeight,
                    convert(joint).y
                );
            }
        }

        grid.position.y = minHeight - 0.02;

        // Resume from the join, not the beginning.
        frame = previousFrameCount - 1;
        drawFrame(frame);

        playing = true;
        lastFrameTime = performance.now();

        document.getElementById("play").textContent = "Pause";

        statusLabel.textContent =
            `Added ${result.frames} frames. Total: ${motion.frames}.`;

    } catch (error) {
        console.error(error);

        frame = previousFrame;
        playing = previousPlaying;
        drawFrame(frame);

        statusLabel.textContent =
            "Continuation failed: " + error.message;

    } finally {
        generateButton.disabled = false;
        continueButton.disabled = !motionSessionId;
    }
};

function animate(time) {
    requestAnimationFrame(animate);

    if (motion && playing && time - lastFrameTime >= 1000 / motion.fps) {
        frame = (frame + 1) % motion.frames;
        drawFrame(frame);
        lastFrameTime = time;
    }

    controls.update();
    renderer.render(scene, camera);
}

loadMotion().catch(error => {
    document.getElementById("prompt").textContent = error.message;
    console.error(error);
});

window.addEventListener("resize", () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
});

animate(0);
</script>
</body>
</html>
